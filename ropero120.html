<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ropero de 120 cm - Emunáh Hogar</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#000;
color:white;
}

header{
background:white;
padding:25px;
text-align:center;
}

header h1{
color:#111;
font-size:38px;
}

header p{
color:#444;
margin-top:10px;
}

.producto{
padding:40px 20px;
max-width:900px;
margin:auto;
}

.imagen-principal img{
width:100%;
max-height:500px;
object-fit:cover;
border-radius:15px;
}

h2{
text-align:center;
color:#c9a227;
margin:25px 0;
font-size:30px;
}

.descripcion{
background:#111;
padding:25px;
border-radius:15px;
margin-top:25px;
text-align:center;
}

.galeria{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:15px;
margin-top:25px;
}

.galeria img{
width:100%;
height:150px;
object-fit:cover;
border-radius:12px;
}

.color{
text-align:center;
margin-top:8px;
}

.boton{
display:inline-block;
padding:14px 35px;
background:#c9a227;
color:#111;
text-decoration:none;
border-radius:30px;
font-weight:bold;
margin:20px 10px;
}

.boton:hover{
background:white;
}

footer{
background:#222;
text-align:center;
padding:25px;
margin-top:40px;
}

</style>

</head>

<body>

<header>

<h1>Emunáh Hogar</h1>

<p>Roperos de Pino Macizo</p>

</header>
